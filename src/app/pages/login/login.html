<div class="login-container">
  
  <div class="login-brand">
    <div class="brand-content">
      <div class="logo-box">
        <span class="material-icons-round">school</span>
      </div>
      <h1>SBPS Admin Pro</h1>
      <p>Streamline your school's administration, manage student records, and oversee fee configurations all in one secure platform.</p>
    </div>
    
    <div class="circle circle-1"></div>
    <div class="circle circle-2"></div>
  </div>

  <div class="login-form-section">
    <div class="form-wrapper">
      
      <div class="form-header">
        <h2>Welcome back</h2>
        <p>Please enter your credentials to access your account.</p>
      </div>

      <form (ngSubmit)="onSubmit()" #loginForm="ngForm" class="auth-form">
        
        <div class="input-group">
          <label for="username">Username</label>
          <div class="input-wrapper">
            <span class="material-icons-round input-icon">person_outline</span>
            <input type="text" id="username" name="username"
                   [(ngModel)]="credentials.username" required
                   placeholder="Enter your username"
                   [disabled]="isLoading"
                   autocomplete="username">
          </div>
        </div>

        <div class="input-group">
          <label for="password">Password</label>
          <div class="input-wrapper">
            <span class="material-icons-round input-icon">lock_outline</span>
            <input [type]="showPassword ? 'text' : 'password'" id="password" name="password"
                   [(ngModel)]="credentials.password" required
                   placeholder="••••••••"
                   [disabled]="isLoading"
                   autocomplete="current-password">
            
            <button type="button" class="toggle-password" (click)="showPassword = !showPassword" tabindex="-1">
              <span class="material-icons-round">{{ showPassword ? 'visibility_off' : 'visibility' }}</span>
            </button>
          </div>
        </div>

        <div class="form-options">
          <label class="remember-me">
            <input type="checkbox">
            <span>Remember for 30 days</span>
          </label>
          <a href="#" class="forgot-password">Forgot password?</a>
        </div>

        <button type="submit" class="btn-login" [disabled]="isLoading">
          <span *ngIf="!isLoading">Sign In</span>
          <span *ngIf="isLoading" class="spinner"></span>
          <span *ngIf="isLoading">Verifying...</span>
        </button>
        
      </form>
      
    </div>
  </div>

</div>
