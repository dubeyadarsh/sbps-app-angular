<div class="page-container">

  <div class="pro-card" style="padding: 24px; margin-bottom: 24px;">
    <h3 style="margin-top: 0; color: var(--primary-color);">Map New Fee Structure</h3>
    
    <div class="form-row" style="align-items: flex-end;">
    <div class="form-group half-width">
  <label>Grade / Standard</label>
  <select class="form-control" [(ngModel)]="newRule.standard">
    <option value="">Select Grade...</option>
    <option *ngFor="let std of standards" [value]="std.value">
      {{ std.label }}
    </option>
  </select>
</div>

      <div class="form-group half-width">
        <label>Fee Facility</label>
        <select class="form-control" [(ngModel)]="newRule.feeTypeId">
          <option value="">Select Facility...</option>
          <option *ngFor="let type of feeTypes" [value]="type.id">{{ type.name }}</option>
        </select>
      </div>

      <div class="form-group half-width">
        <label>Monthly/Base Amount (₹)</label>
        <input type="number" class="form-control" [(ngModel)]="newRule.amount" placeholder="e.g. 2000">
      </div>
<div class="form-group half-width" style="display: flex; align-items: center; gap: 8px; margin-bottom: 8px;">
        <input type="checkbox" id="mandatoryCheck" [(ngModel)]="newRule.isMandatory" style="width: 18px; height: 18px;">
        <label for="mandatoryCheck" style="margin: 0; cursor: pointer;">Is this fee Mandatory for all students?</label>
      </div>
      <div class="form-group">
        <button class="btn-primary" (click)="saveRule()" 
                [disabled]="!newRule.standard || !newRule.feeTypeId || !newRule.amount">
          <span class="material-icons-round">add_circle</span> Add Rule
        </button>
      </div>
    </div>
  </div>

  <div class="pro-card">
    <div class="table-responsive">
      <table class="pro-table">
        <thead>
          <tr>
            <th>Grade</th>
            <th>Fee Facility</th>
            <th>Amount</th>
            <th class="text-right">Actions</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let rule of rules">
            <td><strong>Grade {{ rule.standard }}</strong></td>
            
            <td style="display: flex; align-items: center; gap: 8px;">
              {{ rule.feeTypeName }}
              <span class="badge" [ngClass]="rule.isMandatory ? 'success' : 'warning'" style="font-size: 10px; padding: 2px 6px;">
                {{ rule.isMandatory ? 'Mandatory' : 'Optional' }}
              </span>
            </td>

            <td class="amount-cell">₹{{ rule.amount | number:'1.2-2' }}</td>
            <td class="text-right">
              <button class="icon-btn-small delete" (click)="deleteRule(rule.id)">
                <span class="material-icons-round">delete</span>
              </button>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>
